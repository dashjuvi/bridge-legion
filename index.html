<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b1410;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.g{color:#6f6}.r{color:#f66}
</style></head><body>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
let W,H,DPR;
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);bgCache=null}
addEventListener('resize',rs);
// ---------- numbers ----------
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){if(n<1000)return (n<10&&n%1?n.toFixed(1):Math.floor(n))+'';let e=Math.floor(Math.log10(n)/3);if(e>=SUF.length)return n.toExponential(2);return (n/10**(e*3)).toFixed(n/10**(e*3)<100?2:1).replace(/\.?0+$/,'')+SUF[e]}
function ftime(ms){const s=ms/1000,m=Math.floor(s/60);return m+':'+(s%60).toFixed(2).padStart(5,'0')}
// ---------- save ----------
const DEF={coins:0,level:1,best:1,up:{squad:0,rate:0,dmg:0,bul:0,gate:0,coin:0,base:0},tier:0,medals:0,totalMedals:0,sk:{},pres:0,lb:[],pb:null,ach:{},stats:{kills:0,levels:0,bosses:0,maxSquad:0,coinsAll:0},last:Date.now()};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('bl_save')||'{}'))}catch(e){S=structuredClone(DEF)}
S.up=Object.assign({},DEF.up,S.up);S.stats=Object.assign({},DEF.stats,S.stats);
function save(){S.last=Date.now();localStorage.setItem('bl_save',JSON.stringify(S))}
setInterval(save,5000);
// ---------- data ----------
const TIERS=[
{n:'Rifleman',c:'#2f7bff',h:'#9fd0ff',w:'#333',m:1},
{n:'Knight',c:'#c9ced6',h:'#ffd166',w:'#8a6b2d',m:3},
{n:'Ranger',c:'#2e9e4f',h:'#b6f5a0',w:'#4a3',m:9},
{n:'Trooper',c:'#5a6b7d',h:'#00e5ff',w:'#222',m:27},
{n:'Mech',c:'#ff8c1a',h:'#ffe066',w:'#444',m:81},
{n:'Cyborg',c:'#b02eff',h:'#ff7af5',w:'#333',m:243},
{n:'Titan',c:'#ffd700',h:'#fff',w:'#a60',m:729},
{n:'Starborn',c:'#00ffd5',h:'#fff',w:'#0aa',m:2187}];
const tierCost=t=>2000*Math.pow(12,t);
const UPS=[
['squad','Starting Squad','+2 starting soldiers',15,1.32],
['rate','Fire Rate','+8% fire rate',20,1.35],
['dmg','Damage','+15% bullet damage',25,1.36],
['bul','Multi-shot','+1 extra bullet per volley (every 5 lv: ×1.5 dmg)',60,1.6],
['gate','Gate Bonus','+5% on all + and × gates',40,1.45],
['coin','Loot','+12% coins per level',30,1.4],
['base','Base Barracks','+idle coins/sec (works offline)',50,1.38]];
const upCost=k=>{const u=UPS.find(x=>x[0]==k);return Math.ceil(u[3]*Math.pow(u[4],S.up[k])*(1-sk('cheap')*0.04))};
const SKILLS=[
['war','War Drums','+25% damage per rank',5,1],
['volley','Volley','+15% fire rate per rank',5,1],
['recruit','Recruiters','+5 starting soldiers per rank',5,1],
['gold','Golden Bridge','+40% coins per rank',5,1],
['cheap','Quartermaster','-4% upgrade costs per rank',5,2],
['armor','Plate Armor','Enemies kill 8% fewer soldiers per rank',5,2],
['idle','Logistics','+60% idle income, +2h offline cap per rank',5,2],
['gatek','Gatekeeper','Shooting gates adds +1 extra per hit per rank',3,3],
['nuke','Orbital Nuke','Clears a crowd every 6 s (rank: faster)',3,4],
['start','Head Start','Ascend skips +3 levels per rank',3,4]];
const sk=k=>S.sk[k]||0;
const skCost=(k)=>{const s=SKILLS.find(x=>x[0]==k);return s[4]*(1+sk(k))};
const ACH=[
['lv5','Rookie','Reach level 5',()=>S.best>=5],['lv10','Veteran','Reach level 10',()=>S.best>=10],['lv25','Warlord','Reach level 25',()=>S.best>=25],['lv50','Legend','Reach level 50',()=>S.best>=50],
['sq100','Battalion','Have 100 soldiers',()=>S.stats.maxSquad>=100],['sq1k','Army','Have 1,000 soldiers',()=>S.stats.maxSquad>=1000],['sq10k','Horde','Have 10,000 soldiers',()=>S.stats.maxSquad>=1e4],
['k1k','Exterminator','Defeat 1,000 enemies',()=>S.stats.kills>=1000],['k100k','Annihilator','Defeat 100,000 enemies',()=>S.stats.kills>=1e5],
['b10','Boss Hunter','Defeat 10 bosses',()=>S.stats.bosses>=10],['evo1','Evolved','Evolve your units once',()=>S.tier>=1],['evo4','Machine Age','Reach Mech tier',()=>S.tier>=4],
['pre1','Ascended','Ascend once',()=>S.pres>=1],['pre5','Eternal','Ascend 5 times',()=>S.pres>=5],['sr','Speedrunner','Finish a speedrun',()=>S.lb.length>0],['sr5','Sub-5','Speedrun under 5:00',()=>S.pb&&S.pb.t<300000]];
const achMult=()=>1+Object.keys(S.ach).length*0.03;
// ---------- stats ----------
function stats(sr){
 const u=sr?{squad:0,rate:0,dmg:0,bul:0,gate:0,coin:0}:S.up, t=sr?0:S.tier, s=k=>sr?0:sk(k);
 return{start:5+u.squad*2+s('recruit')*5,
  rate:4*(1+u.rate*0.08)*(1+s('volley')*0.15),
  dmg:1*(1+u.dmg*0.15)*Math.pow(1.5,Math.floor(u.bul/5))*(1+s('war')*0.25)*TIERS[t].m*(1+(sr?0:S.totalMedals)*0.02)*(sr?1:achMult()),
  bul:1+u.bul, gate:1+u.gate*0.05, coin:(1+u.coin*0.12)*(1+s('gold')*0.4)*(1+(sr?0:S.totalMedals)*0.05), armor:1-s('armor')*0.08, gk:1+s('gatek'), nuke:s('nuke')};
}
const idleRate=()=>S.up.base*S.up.base*0.6*(1+S.best*0.15)*(1+sk('idle')*0.6)*(1+S.totalMedals*0.05);
// ---------- level gen ----------
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// difficulty scaled by player power so it stays snappy
function genLevel(lv,sr){
 const R=rng(lv*7919+(sr?13:0)),st=stats(sr),pw=st.dmg*st.rate*st.bul;
 const D=Math.pow(1.17,lv-1);
 const ents=[];let z=40;const len=260+Math.min(lv,30)*14;
 while(z<len-40){
  const r=R();
  if(r<0.42){ // gate pair
   const mk=(good)=>{if(good){return R()<0.25&&lv>1?{op:'x',v:2+(R()<0.15?1:0)}:{op:'+',v:Math.ceil((3+R()*12)*Math.pow(1.12,lv))}}
     return R()<0.5?{op:'-',v:-Math.ceil((4+R()*10)*Math.pow(1.12,lv))}:{op:'+',v:-Math.ceil((1+R()*3)*Math.pow(1.1,lv)), shoot:1}};
   const goodLeft=R()<0.5,a=mk(true),b=mk(R()<0.3);
   ents.push(Object.assign({t:'gate',x:-0.5,z},goodLeft?a:b),Object.assign({t:'gate',x:0.5,z},goodLeft?b:a));z+=34;
  }else if(r<0.62){ // +1 column like the ad: small gate that grows when shot
   ents.push({t:'gate',x:R()<0.5?-0.5:0.5,z,op:'+',v:1,shoot:1});z+=26;
  }else if(r<0.85){
   ents.push({t:'crowd',x:(R()-0.5)*1.2,z,n:Math.ceil((6+R()*10)*D*Math.pow(1.05,lv)),w:0.55});z+=36;
  }else{
   const hp=Math.ceil((40+R()*60)*D*Math.max(1,pw/4)*0.6);
   ents.push({t:'block',x:R()<0.5?-0.5:0.5,z,hp,max:hp});z+=30;
  }
 }
 const bhp=Math.ceil(250*D*Math.max(1,pw/4)*(1+lv*0.04));
 ents.push({t:'boss',x:0,z:len,hp:bhp,max:bhp,cd:0});
 return{ents,len,lv};
}
// ---------- game state ----------
let G=null,mode='menu',shake=0,parts=[],pops=[],tracers=[],last=performance.now(),RUN=null;
function startLevel(lv,sr){
 const st=stats(sr);
 G={lv,sr,st,lvl:genLevel(lv,sr),z:0,x:0,tx:0,squad:st.start,speed:22,shotT:0,boss:false,over:false,t0:performance.now(),kills:0,coins:0,nukeT:0,maxSq:st.start};
 mode='play';parts=[];pops=[];tracers=[];
 for(const s of document.querySelectorAll('.scr'))s.classList.remove('on');
 $('hud').style.display='flex';$('prog').style.display='block';
}
// ---------- projection ----------
const CAMBACK=10,FAR=120;
function proj(x,z){const d=z-G.z+CAMBACK;if(d<=0.5)return null;const s=CAMBACK/d;const hy=H*0.27,by=H*0.80;return{x:W/2+x*W*0.42*s*1.5,y:hy+(by-hy)*s,s}}
// ---------- sprites ----------
const sprC={};
function soldierSpr(t,enemy){const k=t+'_'+enemy;if(sprC[k])return sprC[k];const c=document.createElement('canvas');c.width=40;c.height=56;const g=c.getContext('2d');
 const T=TIERS[t],body=enemy?'#d62828':T.c,hd=enemy?'#ff9b85':T.h;
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(20,52,13,4,0,0,7);g.fill();
 g.fillStyle=enemy?'#7a0f0f':'#1d2a44';g.fillRect(12,36,6,15);g.fillRect(22,36,6,15);
 const gr=g.createLinearGradient(0,16,0,40);gr.addColorStop(0,hd);gr.addColorStop(.35,body);gr.addColorStop(1,'#0005');g.fillStyle=body;g.fillRect(9,18,22,20);g.fillStyle=gr;g.fillRect(9,18,22,20);
 g.fillStyle=hd;g.beginPath();g.arc(20,12,8,0,7);g.fill();
 if(!enemy&&t>=1){g.fillStyle=T.w;g.fillRect(12,8,16,4)}
 if(!enemy&&t>=4){g.fillStyle='#fff8';g.fillRect(15,10,10,3)}
 g.fillStyle=enemy?'#300':T.w;g.fillRect(26,6,5,22);
 return sprC[k]=c}
// ---------- background ----------
let bgCache=null;
function drawBg(){
 if(!bgCache){bgCache=document.createElement('canvas');bgCache.width=W*DPR;bgCache.height=H*DPR;const g=bgCache.getContext('2d');g.scale(DPR,DPR);
  const sk=g.createLinearGradient(0,0,0,H*0.4);sk.addColorStop(0,'#5b6b80');sk.addColorStop(1,'#d9a46a');g.fillStyle=sk;g.fillRect(0,0,W,H);
  const R=rng(5);for(let i=0;i<26;i++){const bx=R()*W,bw=20+R()*50,bh=40+R()*H*0.22;g.fillStyle=`rgb(${60+R()*30},${55+R()*25},${55+R()*25})`;g.fillRect(bx,H*0.29-bh,bw,bh);
   g.fillStyle='#0003';for(let wy=H*0.29-bh+6;wy<H*0.28;wy+=10)for(let wx=bx+4;wx<bx+bw-4;wx+=9)if(R()<.6)g.fillRect(wx,wy,4,5);
   if(false){;g.beginPath();g.moveTo(bx,H*0.29-bh);g.lineTo(bx+bw*R(),H*0.29-bh+15+R()*20);g.lineTo(bx+bw,H*0.29-bh);g.fill()}}
  const lv=g.createLinearGradient(0,H*0.27,0,H);lv.addColorStop(0,'#3b1a0c');lv.addColorStop(1,'#140806');g.fillStyle=lv;g.fillRect(0,H*0.27,W,H);
 }
 cx.drawImage(bgCache,0,0,W,H);
 // lava glow cracks (animated)
 const tt=performance.now()/1000;
 for(let i=0;i<40;i++){const z=G.z+((i*9.7-G.z)%FAR+FAR)%FAR;const side=i%2?1:-1;const p=proj(side*(1.6+(i*0.37)%1.5),z);if(!p)continue;
  cx.fillStyle=`rgba(255,${90+60*Math.sin(tt*2+i)|0},20,${0.5*p.s+0.15})`;cx.beginPath();cx.ellipse(p.x,p.y,30*p.s*3,6*p.s*3,0,0,7);cx.fill()}
}
function quad(a,b,c,d,f){cx.fillStyle=f;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.lineTo(c.x,c.y);cx.lineTo(d.x,d.y);cx.fill()}
function drawBridge(){
 const zn=G.z-CAMBACK+1,zf=G.z+FAR;
 const a=proj(-1.05,zn),b=proj(1.05,zn),c=proj(1.05,zf),d=proj(-1.05,zf);
 quad(a,b,c,d,'#6d625a');
 // tiles
 const step=6,off=Math.floor(zn/step)*step;
 for(let z=off;z<zf;z+=step){const p1=proj(-1,z),p2=proj(1,z),p3=proj(1,z+step*0.5),p4=proj(-1,z+step*0.5);if(!p1||!p3)continue;quad(p1,p2,p3,p4,((z/step)&1)?'#7d7067':'#74685f');
  if(((z/step)|0)%5==0){const g1=proj(-0.95,z),g2=proj(-0.1,z),g3=proj(-0.1,z+3),g4=proj(-0.95,z+3);quad(g1,g2,g3,g4,'#3a3a40');}
 }
 // lane line
 for(let z=off;z<zf;z+=step){const p=proj(0,z),q=proj(0,z+step*0.5);if(!p||!q)continue;cx.strokeStyle='#ffffff40';cx.lineWidth=3*p.s;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}
 // rails
 for(const sd of[-1,1]){const r1=proj(sd*1.05,zn),r2=proj(sd*1.05,zf),r3=proj(sd*1.12,zf),r4=proj(sd*1.12,zn);quad(r1,r2,r3,r4,'#3d2f28');
  for(let z=off;z<zf;z+=step*2){const p=proj(sd*1.08,z);if(!p)continue;cx.fillStyle='#4a3a32';cx.fillRect(p.x-4*p.s*3,p.y-26*p.s*3,8*p.s*3,26*p.s*3)}}
 // finish arch near boss
}
// ---------- loop ----------
function hit(e,dmg){
 if(e.t=='gate'){e.v+=G.st.gk*(e.op=='x'?0:1)*(dmg>0?1:0);if(e.op=='-'&&e.v>=0){e.op='+'}pops.push({x:e.x,z:e.z,txt:'+'+G.st.gk,c:'#7ff',l:0.4});return}
 if(e.t=='crowd'){const k=Math.min(e.n,Math.max(1,Math.floor(dmg/Math.pow(1.15,G.lv)*0.9)));e.n-=k;G.kills+=k;if(e.n<=0){e.dead=1;boom(e.x,e.z,20,'#f44');G.coins+=Math.pow(1.2,G.lv)*3}return}
 e.hp-=dmg;if(e.hp<=0&&!e.dead){e.dead=1;shake=e.t=='boss'?22:9;boom(e.x,e.z,e.t=='boss'?120:45,'#fa3');G.coins+=Math.pow(1.22,G.lv)*(e.t=='boss'?40:8)}
}
function boom(x,z,n,c){for(let i=0;i<n;i++)parts.push({x,z,y:0,vx:(Math.random()-.5)*1.4,vz:(Math.random()-.5)*14,vy:Math.random()*14,l:0.6+Math.random()*0.6,c:Math.random()<.4?'#ffe066':c,s:2+Math.random()*4})}
function pop(txt,c){pops.push({x:G.x,z:G.z+3,txt,c,l:1})}
function update(dt){
 if(!G||G.over)return;
 G.x+=(G.tx-G.x)*Math.min(1,dt*12);
 const ents=G.lvl.ents,boss=ents[ents.length-1];
 // target ahead
 let tgt=null,best=1e9;
 for(const e of ents){if(e.dead||e.used)continue;const dz=e.z-G.z;if(dz<0||dz>70)continue;const wx=e.t=='crowd'?e.w:e.t=='boss'?1.2:0.42;if(Math.abs(e.x-G.x)>wx+0.15)continue;if(dz<best){best=dz;tgt=e}}
 // shooting
 G.shotT+=dt*G.st.rate;
 while(G.shotT>=1){G.shotT-=1;if(tgt){const vol=G.st.bul*Math.min(G.squad,40)*(1+Math.log10(Math.max(1,G.squad))*(G.squad>40?Math.log2(G.squad/40)+1:0)/1);
  const dmg=G.st.dmg*vol;
  if(tgt.t=='gate'){if(tgt.shoot||tgt.op=='-')for(let i=0;i<G.st.bul;i++)hit(tgt,1)}else hit(tgt,dmg);
  for(let i=0;i<Math.min(6,G.st.bul+Math.min(G.squad,30)/8);i++)tracers.push({x:G.x+(Math.random()-.5)*0.3,z:G.z+0.5,tx:tgt.x+(Math.random()-.5)*0.3,tz:tgt.z,l:0.12})}}
 // nuke skill
 if(G.st.nuke){G.nukeT+=dt;if(G.nukeT>6-G.st.nuke*1.2){const c=ents.find(e=>e.t=='crowd'&&!e.dead&&e.z-G.z<60&&e.z>G.z);if(c){G.nukeT=0;G.kills+=c.n;c.n=0;c.dead=1;boom(c.x,c.z,60,'#fff');shake=10;pop('☢ NUKE','#ff0')}}}
 // movement
 let blocked=false;
 for(const e of ents){if(e.dead||e.used)continue;const dz=e.z-G.z;
  if(e.t=='gate'&&dz<0.6&&dz>-1&&Math.abs(e.x-G.x)<0.5){e.used=1;const before=G.squad;
   if(e.op=='x')G.squad=Math.floor(G.squad*(e.v*G.st.gate));else{const v=e.v>0?Math.ceil(e.v*G.st.gate):e.v;G.squad=Math.max(0,G.squad+v)}
   const d=G.squad-before;pop((d>=0?'+':'')+fmt(Math.abs(d))*(1)+'' ,d>=0?'#6f6':'#f55');if(d<0)pop('-'+fmt(-d),'#f55'),pops.splice(pops.length-2,1);boom(e.x,e.z,15,d>=0?'#4cf':'#f44');
   for(const o of ents)if(o.t=='gate'&&o!==e&&Math.abs(o.z-e.z)<1)o.used=1}
  if(e.t=='crowd'&&dz<2.5&&dz>-1&&Math.abs(e.x-G.x)<e.w+0.2){blocked=true;const trade=Math.max(1,Math.ceil(Math.min(e.n,G.squad)*dt*4));const ek=Math.min(e.n,trade);e.n-=ek;G.kills+=ek;G.squad-=Math.ceil(ek*G.st.armor);if(Math.random()<.3)boom(e.x,e.z,2,'#f33');if(e.n<=0){e.dead=1;G.coins+=Math.pow(1.2,G.lv)*3}}
  if(e.t=='block'&&dz<1.5&&dz>-1&&Math.abs(e.x-G.x)<0.5){const loss=Math.ceil(e.hp/G.st.dmg/6*G.st.armor);G.squad-=loss;e.dead=1;shake=12;boom(e.x,e.z,40,'#fa3');pop('-'+fmt(loss),'#f55')}
  if(e.t=='boss'&&dz<14){blocked=true;G.boss=true}
 }
 if(G.boss&&!boss.dead){boss.cd-=dt;if(boss.cd<=0){boss.cd=0.8;const k=Math.max(1,Math.ceil(G.squad*0.06*G.st.armor+Math.pow(1.13,G.lv)));G.squad-=k;shake=6;pop('-'+fmt(k),'#f55');boom(G.x,G.z+1,14,'#f40')}}
 if(!blocked)G.z+=G.speed*dt;
 G.squad=Math.max(0,Math.floor(G.squad));G.maxSq=Math.max(G.maxSq,G.squad);
 if(boss.dead)finish(true);else if(G.squad<=0)finish(false);
}
function finish(win){
 G.over=true;const st=G.st;const coins=Math.ceil((G.coins+G.lv*10)*st.coin*(win?1:0.35));
 S.stats.kills+=G.kills;S.stats.maxSquad=Math.max(S.stats.maxSquad,G.maxSq);
 if(G.sr){runEnd(win);return}
 S.coins+=coins;S.stats.coinsAll+=coins;
 if(win){S.stats.levels++;S.stats.bosses++;S.level=G.lv+1;S.best=Math.max(S.best,S.level)}
 checkAch();save();
 setTimeout(()=>{mode='end';$('hud').style.display='none';$('prog').style.display='none';$('etitle').textContent=win?'VICTORY!':'DEFEATED';
  $('einfo').innerHTML=`Level ${G.lv}<br>🪙 +${fmt(coins)}<br><small>Enemies defeated: ${fmt(G.kills)} • Peak squad: ${fmt(G.maxSq)}</small>`;$('esplit').innerHTML='';
  $('enext').style.display=win?'':'none';$('end').classList.add('on')},win?900:600);
}
// speedrun: 10 fixed levels, base stats (no upgrades), timer & splits
function startRun(){RUN={t0:performance.now(),splits:[],lv:1};startLevel(1,true)}
function runEnd(win){
 const now=performance.now();
 if(win){RUN.splits.push(now-RUN.t0);if(RUN.splits.length<10){setTimeout(()=>startLevel(RUN.splits.length+1,true),700);return}}
 const t=now-RUN.t0,done=win;
 setTimeout(()=>{mode='end';$('hud').style.display='none';$('prog').style.display='none';
  let pb=S.pb;let h='<table><tr><td>Split</td><td>Time</td><td>vs PB</td></tr>';
  RUN.splits.forEach((s,i)=>{const d=pb?s-pb.s[i]:null;h+=`<tr><td>Level ${i+1}</td><td>${ftime(s)}</td><td class="${d==null?'':d<0?'g':'r'}">${d==null?'—':(d<0?'-':'+')+ftime(Math.abs(d))}</td></tr>`});h+='</table>';
  if(done){S.lb.push({t,s:RUN.splits,d:new Date().toLocaleDateString()});S.lb.sort((a,b)=>a.t-b.t);S.lb=S.lb.slice(0,10);if(!pb||t<pb.t)S.pb={t,s:RUN.splits};checkAch();save()}
  $('etitle').textContent=done?'RUN COMPLETE':'RUN FAILED';$('einfo').innerHTML=done?`⏱ ${ftime(t)}${pb&&t<pb.t?'<br><span class=g>NEW PERSONAL BEST!</span>':''}`:`Reached level ${RUN.splits.length+1}`;
  $('esplit').innerHTML=h;$('enext').style.display='none';$('end').classList.add('on');RUN.ended=1},700);
}
// ---------- render ----------
function render(dt){
 if(!G){cx.fillStyle='#1b1410';cx.fillRect(0,0,W,H);return}
 cx.save();if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*40)}
 drawBg();drawBridge();
 const ents=G.lvl.ents;
 const list=ents.filter(e=>!e.dead&&!(e.used&&e.t=='gate')&&e.z>G.z-CAMBACK+2&&e.z<G.z+FAR).sort((a,b)=>b.z-a.z);
 for(const e of list){const p=proj(e.x,e.z);if(!p)continue;const s=p.s*3;
  if(e.t=='gate'){const good=e.v>0;const w=W*0.42*0.85*p.s*1.5/2*1.9,h=34*s;
   cx.fillStyle=good?(e.op=='x'?'#e8b500':'#1f6fe0'):'#c81e1e';cx.globalAlpha=.88;cx.fillRect(p.x-w/2,p.y-h,w,h);cx.globalAlpha=1;
   cx.fillStyle='#fff3';cx.fillRect(p.x-w/2,p.y-h,w,h*0.25);cx.strokeStyle='#fff';cx.lineWidth=2*s;cx.strokeRect(p.x-w/2,p.y-h,w,h);
   cx.fillStyle='#fff';cx.font=`900 ${Math.max(8,20*s)}px system-ui`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3*s;cx.strokeStyle='#0008';
   const txt=e.op=='x'?'×'+e.v:(e.v>0?'+':'')+fmt(Math.abs(e.v))*(1)+'';const tx=e.op=='x'?'×'+e.v:(e.v>0?'+'+fmt(e.v):'-'+fmt(-e.v));cx.strokeText(tx,p.x,p.y-h/2);cx.fillText(tx,p.x,p.y-h/2)}
  else if(e.t=='crowd'){const n=Math.min(e.n,45),spr=soldierSpr(0,1);const cols=Math.ceil(Math.sqrt(n*2));
   for(let i=0;i<n;i++){const ox=((i%cols)/cols-0.5)*e.w*2,oz=Math.floor(i/cols)*0.9;const q=proj(e.x+ox,e.z+oz);if(!q)continue;const ss=q.s*1.6;cx.drawImage(spr,q.x-10*ss,q.y-28*ss,20*ss,28*ss)}
   label(p.x,p.y-40*s,fmt(e.n),'#c00',s)}
  else{const boss=e.t=='boss';const w=(boss?150:56)*s,h=(boss?150:60)*s;
   cx.fillStyle='#0005';cx.beginPath();cx.ellipse(p.x,p.y,w*0.6,8*s,0,0,7);cx.fill();
   const gr=cx.createLinearGradient(p.x-w/2,0,p.x+w/2,0);gr.addColorStop(0,boss?'#4a0d0d':'#3b4048');gr.addColorStop(.5,boss?'#9b1c1c':'#7c8592');gr.addColorStop(1,boss?'#3a0808':'#2b2f35');
   cx.fillStyle=gr;cx.fillRect(p.x-w/2,p.y-h,w,h);cx.strokeStyle=boss?'#ffb703':'#c9d1d9';cx.lineWidth=3*s;cx.strokeRect(p.x-w/2,p.y-h,w,h);
   if(boss){cx.fillStyle='#ffdd00';const t=performance.now()/200;cx.beginPath();cx.arc(p.x-w*0.2,p.y-h*0.68,w*0.07*(1+0.2*Math.sin(t)),0,7);cx.arc(p.x+w*0.2,p.y-h*0.68,w*0.07*(1+0.2*Math.sin(t)),0,7);cx.fill();cx.fillStyle='#200';cx.fillRect(p.x-w*0.3,p.y-h*0.4,w*0.6,h*0.12);
    cx.fillStyle='#ffb703';for(let i=0;i<5;i++){cx.beginPath();cx.moveTo(p.x-w/2+i*w/4,p.y-h);cx.lineTo(p.x-w/2+i*w/4+w/8,p.y-h-22*s);cx.lineTo(p.x-w/2+i*w/4+w/4,p.y-h);cx.fill()}}
   else{cx.fillStyle='#fff';cx.font=`${26*s}px system-ui`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🛡',p.x,p.y-h*0.62)}
   // hp bar
   const bw=w*0.95;cx.fillStyle='#000a';cx.fillRect(p.x-bw/2,p.y-h-(boss?34:14)*s,bw,7*s);cx.fillStyle=boss?'#ff3b3b':'#ffd166';cx.fillRect(p.x-bw/2,p.y-h-(boss?34:14)*s,bw*Math.max(0,e.hp/e.max),7*s);
   label(p.x,p.y-h*0.25,fmt(Math.max(0,e.hp)),boss?'#600':'#234',s*(boss?1.2:0.9))}
 }
 // tracers
 cx.lineCap='round';
 for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.l-=dt;if(t.l<=0){tracers.splice(i,1);continue}const k=1-t.l/0.12;const a=proj(t.x+(t.tx-t.x)*k*0.8,t.z+(t.tz-t.z)*k*0.8),b=proj(t.x+(t.tx-t.x)*Math.min(1,k*0.8+0.2),t.z+(t.tz-t.z)*Math.min(1,k*0.8+0.2));if(!a||!b)continue;
  cx.strokeStyle='#fff6a0';cx.lineWidth=Math.max(1,2.5*a.s*3);cx.beginPath();cx.moveTo(a.x,a.y-12*a.s*3);cx.lineTo(b.x,b.y-12*b.s*3);cx.stroke()}
 // squad
 const n=Math.min(G.squad,140),spr=soldierSpr(G.sr?0:S.tier,0),cols=Math.max(3,Math.ceil(Math.sqrt(n*1.4)));const rad=Math.min(0.42,0.06+Math.sqrt(n)*0.022);
 const order=[];for(let i=0;i<n;i++){const r=i/cols|0,c=i%cols;order.push([G.x+((c+0.5)/cols-0.5)*rad*2+((r&1)?0.02:0),G.z+1.2-r*0.32])}
 order.sort((a,b)=>b[1]-a[1]);const bob=performance.now()/90;
 for(let i=0;i<order.length;i++){const [x,z]=order[i];const q=proj(x,z);if(!q)continue;const ss=q.s*1.25;const by=Math.abs(Math.sin(bob+i))*2*ss;cx.drawImage(spr,q.x-10*ss,q.y-28*ss-by,20*ss,28*ss)}
 const sp=proj(G.x,G.z);if(sp)label(sp.x,sp.y+16,fmt(G.squad),'#1f6fe0',1.2);
 // particles
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.z+=p.vz*dt;p.vy-=30*dt;p.y=Math.max(0,p.y+p.vy*dt);const q=proj(p.x,p.z);if(!q)continue;cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;const r=p.s*q.s*3;cx.fillRect(q.x-r/2,q.y-p.y*q.s*6-r/2,r,r)}cx.globalAlpha=1;
 for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.l-=dt;if(p.l<=0){pops.splice(i,1);continue}const q=proj(p.x,p.z);if(!q)continue;cx.globalAlpha=Math.min(1,p.l*2);cx.font=`900 ${16+q.s*30}px system-ui`;cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#000';const y=q.y-60*q.s*3-(1-p.l)*60;cx.strokeText(p.txt,q.x,y);cx.fillStyle=p.c;cx.fillText(p.txt,q.x,y)}cx.globalAlpha=1;
 cx.restore();
 // hud
 $('hl').textContent=(G.sr?'⏱ ':'Lv ')+G.lv;$('hc').textContent='🪙 '+fmt(S.coins+G.coins);
 $('ht').textContent=G.sr&&RUN?ftime(performance.now()-RUN.t0):'⚔ '+fmt(G.kills);
 $('prog').firstChild.style.width=Math.min(100,G.z/(G.lvl.len-14)*100)+'%';
}
function label(x,y,t,bg,s){cx.font=`900 ${Math.max(11,15*s)}px system-ui`;const w=cx.measureText(t).width+12;cx.fillStyle=bg;cx.beginPath();cx.roundRect(x-w/2,y-11*Math.max(.75,s),w,22*Math.max(.75,s),8);cx.fill();cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y)}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(mode=='play')update(dt);render(dt);requestAnimationFrame(loop)}
// ---------- input ----------
let dragX=null,dragG=0;
cv.addEventListener('pointerdown',e=>{if(!G)return;dragX=e.clientX;dragG=G.tx});
addEventListener('pointermove',e=>{if(dragX==null||!G)return;G.tx=Math.max(-0.85,Math.min(0.85,dragG+(e.clientX-dragX)/(W*0.38)))});
addEventListener('pointerup',()=>dragX=null);
// ---------- idle ----------
let idleAcc=0;
setInterval(()=>{const r=idleRate();if(r>0){S.coins+=r;S.stats.coinsAll+=r;if(mode=='menu')refreshTop()}},1000);
function offline(){const sec=Math.min((Date.now()-S.last)/1000,(8+sk('idle')*2)*3600);const g=sec*idleRate();if(g>1&&sec>60){S.coins+=g;toast(`Barracks earned 🪙 ${fmt(g)} while you were away`)}}
// ---------- menu ----------
let curTab='up';
function toast(t){const e=$('toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}
function checkAch(){for(const a of ACH)if(!S.ach[a[0]]&&a[3]()){S.ach[a[0]]=1;toast('🏆 '+a[1])}}
function medalGain(){return Math.max(0,Math.floor(Math.pow(Math.max(0,S.best-9),1.25)))}
function refreshTop(){$('mc').textContent='🪙 '+fmt(S.coins);$('mm').textContent='🎖 '+fmt(S.medals);$('ml').textContent='Best Lv '+S.best;$('mtier').textContent=TIERS[S.tier].n+' Legion'+(idleRate()>0?` • 🪙${fmt(idleRate())}/s`:'');$('play').textContent='▶ PLAY LEVEL '+S.level;
 document.querySelectorAll('[data-cost]').forEach(b=>b.disabled=S.coins<+b.dataset.cost)}
function showMenu(){mode='menu';G=null;for(const s of document.querySelectorAll('.scr'))s.classList.remove('on');$('menu').classList.add('on');$('hud').style.display='none';$('prog').style.display='none';drawTab();refreshTop()}
function drawTab(){const T=$('tab');let h='';
 if(curTab=='up'){for(const u of UPS){const c=upCost(u[0]);h+=`<div class="card"><div class="t"><b>${u[1]}</b> <small>Lv ${S.up[u[0]]}</small><br><small>${u[2]}</small></div><button class="btn" data-up="${u[0]}" data-cost="${c}">🪙 ${fmt(c)}</button></div>`}}
 else if(curTab=='evo'){const t=S.tier;h+=`<h2>Unit Evolution</h2><div class="card"><div class="t"><b>Current: ${TIERS[t].n}</b><br><small>Damage ×${fmt(TIERS[t].m)}</small></div></div>`;
  if(t<TIERS.length-1){const c=tierCost(t);h+=`<div class="card"><div class="t"><b>Evolve → ${TIERS[t+1].n}</b><br><small>Damage ×${fmt(TIERS[t+1].m)}, new look. Needs best level ${(t+1)*4}.</small></div><button class="btn purple" id="evo" data-cost="${c}" ${S.best<(t+1)*4?'disabled':''}>🪙 ${fmt(c)}</button></div>`}
  h+='<h2>Tiers</h2>'+TIERS.map((x,i)=>`<div class="card" style="opacity:${i<=t?1:.5}"><div class="t"><b style="color:${x.c}">${x.n}</b> <small>×${fmt(x.m)} dmg</small></div></div>`).join('')}
 else if(curTab=='pre'){const g=medalGain();h+=`<h2>Ascend</h2><div class="card"><div class="t">Reset coins, level, upgrades & tier for <b>🎖 ${g} War Medals</b>.<br><small>Each medal ever earned: +2% dmg, +5% coins & idle. Unlocks at best level 10.</small></div><button class="btn purple" id="asc" ${g<1?'disabled':''}>Ascend</button></div><h2>Skill Tree</h2>`;
  for(const s of SKILLS){const r=sk(s[0]),c=skCost(s[0]),mx=r>=s[3];h+=`<div class="card"><div class="t"><b>${s[1]}</b> <small>${r}/${s[3]}</small><br><small>${s[2]}</small></div><button class="btn blue" data-sk="${s[0]}" ${mx||S.medals<c?'disabled':''}>${mx?'MAX':'🎖 '+c}</button></div>`}}
 else if(curTab=='run'){h+=`<h2>Speedrun</h2><div class="card"><div class="t">10 fixed levels with a fresh base squad (no upgrades) — pure skill. Live timer, splits vs personal best.</div></div><div class="row"><button class="btn blue" id="srun">⏱ Start Speedrun</button></div><h2>Top 10 (this device)</h2>`;
  h+=S.lb.length?'<table>'+S.lb.map((r,i)=>`<tr><td>#${i+1}</td><td><b>${ftime(r.t)}</b></td><td><small>${r.d}</small></td></tr>`).join('')+'</table>':'<small>No runs yet.</small>';
  if(S.pb)h+='<h2>PB splits</h2><table>'+S.pb.s.map((s,i)=>`<tr><td>Level ${i+1}</td><td>${ftime(s)}</td><td>${ftime(s-(S.pb.s[i-1]||0))}</td></tr>`).join('')+'</table><div class="row" style="margin-top:8px"><button class="btn gray" id="copy">Copy result</button></div>'}
 else{h+=`<h2>Trophies ${Object.keys(S.ach).length}/${ACH.length} <small>(+3% dmg each)</small></h2>`+ACH.map(a=>`<div class="card" style="opacity:${S.ach[a[0]]?1:.45}"><div class="t"><b>${S.ach[a[0]]?'🏆':'🔒'} ${a[1]}</b><br><small>${a[2]}</small></div></div>`).join('')+`<h2>Stats</h2><small>Kills ${fmt(S.stats.kills)} • Levels ${S.stats.levels} • Bosses ${S.stats.bosses} • Peak squad ${fmt(S.stats.maxSquad)} • Ascensions ${S.pres}</small><div class="row" style="margin-top:10px"><button class="btn gray" id="reset">Reset save</button></div>`}
 T.innerHTML=h;refreshTop()}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;curTab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));drawTab()};
$('tab').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.up){const k=b.dataset.up,c=upCost(k);if(S.coins>=c){S.coins-=c;S.up[k]++;drawTab();save()}}
 else if(b.dataset.sk){const k=b.dataset.sk,c=skCost(k);if(S.medals>=c){S.medals-=c;S.sk[k]=sk(k)+1;drawTab();save()}}
 else if(b.id=='evo'){const c=tierCost(S.tier);if(S.coins>=c){S.coins-=c;S.tier++;checkAch();toast('⚡ Evolved into '+TIERS[S.tier].n+'!');drawTab();save()}}
 else if(b.id=='asc'){const g=medalGain();if(g>0&&confirm(`Ascend for ${g} War Medals?`)){S.medals+=g;S.totalMedals+=g;S.pres++;S.coins=0;S.up=structuredClone(DEF.up);S.tier=0;S.level=1+sk('start')*3;S.best=S.level;checkAch();drawTab();save()}}
 else if(b.id=='srun')startRun();
 else if(b.id=='copy'){const t=`Bridge Legion speedrun: ${ftime(S.pb.t)}\n`+S.pb.s.map((s,i)=>`L${i+1} ${ftime(s)}`).join('\n');navigator.clipboard&&navigator.clipboard.writeText(t);toast('Copied!')}
 else if(b.id=='reset'){if(confirm('Erase all progress?')){localStorage.removeItem('bl_save');location.reload()}}};
$('play').onclick=()=>startLevel(S.level,false);
$('eagain').onclick=()=>{if(G.sr)startRun();else startLevel(G.lv,false)};
$('enext').onclick=()=>startLevel(S.level,false);
$('emenu').onclick=showMenu;
rs();offline();checkAch();showMenu();requestAnimationFrame(loop);
window.__bl={S,get G(){return G},startLevel,stats,showMenu};
